<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .start-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 30px;
        }

        .start-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .start-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .test-section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .test-section.active {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .test-section.completed {
            border-color: #4caf50;
            background: #f1f8f4;
        }

        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .test-name {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .test-status {
            font-size: 12px;
            color: #999;
            font-weight: 500;
        }

        .test-section.active .test-status {
            color: #667eea;
        }

        .test-section.completed .test-status {
            color: #4caf50;
        }

        .result-value {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
            margin: 10px 0;
        }

        .test-section.completed .result-value {
            color: #4caf50;
        }

        .result-unit {
            font-size: 14px;
            color: #666;
            margin-left: 5px;
        }

        .data-usage {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }

        .summary {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            color: white;
            display: none;
        }

        .summary.show {
            display: block;
        }

        .summary h2 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            border: 1px solid #ef5350;
        }

        .error-message.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #667eea;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Speed Test</h1>

        <button class="start-button" id="startButton">Start Test</button>

        <div class="test-section" id="pingSection">
            <div class="test-header">
                <span class="test-name">Ping / Latency</span>
                <span class="test-status" id="pingStatus">Waiting...</span>
            </div>
            <div class="result-value" id="pingResult">--<span class="result-unit">ms</span></div>
            <div class="progress-bar">
                <div class="progress-fill" id="pingProgress"></div>
            </div>
        </div>

        <div class="test-section" id="downloadSection">
            <div class="test-header">
                <span class="test-name">Download Speed</span>
                <span class="test-status" id="downloadStatus">Waiting...</span>
            </div>
            <div class="result-value" id="downloadResult">--<span class="result-unit">Mbps</span></div>
            <div class="data-usage" id="downloadData">Data used: --</div>
            <div class="progress-bar">
                <div class="progress-fill" id="downloadProgress"></div>
            </div>
        </div>

        <div class="test-section" id="uploadSection">
            <div class="test-header">
                <span class="test-name">Upload Speed</span>
                <span class="test-status" id="uploadStatus">Waiting...</span>
            </div>
            <div class="result-value" id="uploadResult">--<span class="result-unit">Mbps</span></div>
            <div class="data-usage" id="uploadData">Data used: --</div>
            <div class="progress-bar">
                <div class="progress-fill" id="uploadProgress"></div>
            </div>
        </div>

        <div class="summary" id="summary">
            <h2>Test Summary</h2>
            <div class="summary-item">
                <span>Average Ping:</span>
                <span id="summaryPing">--</span>
            </div>
            <div class="summary-item">
                <span>Download Speed:</span>
                <span id="summaryDownload">--</span>
            </div>
            <div class="summary-item">
                <span>Upload Speed:</span>
                <span id="summaryUpload">--</span>
            </div>
            <div class="summary-item">
                <span>Total Data Downloaded:</span>
                <span id="summaryDownloadData">--</span>
            </div>
            <div class="summary-item">
                <span>Total Data Uploaded:</span>
                <span id="summaryUploadData">--</span>
            </div>
        </div>

        <div class="error-message" id="errorMessage"></div>
    </div>

    <script>
        // Configuration - Dynamic testing with stabilization detection
        const CONFIG = {
            PING_COUNT: 5,                    // Number of ping tests to average
            PARALLEL_CONNECTIONS: 8,          // Parallel connections for better saturation
            STREAM_SIZE: 1024 * 1024 * 1024,  // 1 GB continuous stream (will be aborted when stable)
            UPLOAD_BUFFER_SIZE: 50 * 1024 * 1024,  // 50 MB upload buffer per request
            MIN_TEST_DURATION: 2000,          // Minimum 2 seconds of testing
            MAX_TEST_DURATION: 20000,         // Maximum 20 seconds to prevent hanging
            STABILIZATION_WINDOW: 8,          // Number of measurements to check for stability
            STABILIZATION_THRESHOLD: 0.05,    // 5% coefficient of variation for stability
            MEASUREMENT_INTERVAL: 250         // Take speed measurement every 250ms
        };

        // State
        let serverUrl = '';
        let testResults = {
            ping: 0,
            download: 0,
            upload: 0,
            downloadData: 0,
            uploadData: 0
        };

        // DOM Elements
        const elements = {
            startButton: document.getElementById('startButton'),
            pingSection: document.getElementById('pingSection'),
            pingStatus: document.getElementById('pingStatus'),
            pingResult: document.getElementById('pingResult'),
            pingProgress: document.getElementById('pingProgress'),
            downloadSection: document.getElementById('downloadSection'),
            downloadStatus: document.getElementById('downloadStatus'),
            downloadResult: document.getElementById('downloadResult'),
            downloadData: document.getElementById('downloadData'),
            downloadProgress: document.getElementById('downloadProgress'),
            uploadSection: document.getElementById('uploadSection'),
            uploadStatus: document.getElementById('uploadStatus'),
            uploadResult: document.getElementById('uploadResult'),
            uploadData: document.getElementById('uploadData'),
            uploadProgress: document.getElementById('uploadProgress'),
            summary: document.getElementById('summary'),
            errorMessage: document.getElementById('errorMessage')
        };

        // Utility Functions
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatSpeed(bitsPerSecond) {
            const mbps = bitsPerSecond / (1024 * 1024);
            return mbps.toFixed(2);
        }

        // Speed stabilization detection - core algorithm for minimizing data usage
        // This function determines when to stop the test by detecting when speed has stabilized.
        // Instead of transferring a fixed amount of data, we measure continuously and stop
        // when the speed readings become consistent, minimizing both time and data spent.
        function isSpeedStable(speedHistory) {
            // Need minimum number of samples before we can determine stability
            if (speedHistory.length < CONFIG.STABILIZATION_WINDOW) {
                return false;
            }

            // Get last N measurements for stability analysis
            const recent = speedHistory.slice(-CONFIG.STABILIZATION_WINDOW);

            // Calculate mean (average) speed
            const mean = recent.reduce((a, b) => a + b, 0) / recent.length;

            // Calculate standard deviation (how much speeds vary from the mean)
            const variance = recent.reduce((sum, speed) => sum + Math.pow(speed - mean, 2), 0) / recent.length;
            const stdDev = Math.sqrt(variance);

            // Calculate coefficient of variation (CV = stdDev / mean)
            // CV expresses variability as a percentage of the mean
            // Lower CV = more stable/consistent measurements
            const cv = stdDev / mean;

            // Speed is considered stable if CV is below our threshold (5%)
            // This means recent measurements are within 5% of each other
            return cv < CONFIG.STABILIZATION_THRESHOLD;
        }

        function showError(message) {
            elements.errorMessage.textContent = message;
            elements.errorMessage.classList.add('show');
        }

        function hideError() {
            elements.errorMessage.classList.remove('show');
        }

        function setTestStatus(section, status, progress) {
            const statusElement = elements[section + 'Status'];
            const progressElement = elements[section + 'Progress'];
            const sectionElement = elements[section + 'Section'];

            statusElement.textContent = status;
            if (progress !== undefined) {
                progressElement.style.width = progress + '%';
            }

            if (status === 'Testing...') {
                sectionElement.classList.add('active');
                sectionElement.classList.remove('completed');
            } else if (status === 'Completed') {
                sectionElement.classList.remove('active');
                sectionElement.classList.add('completed');
            } else {
                sectionElement.classList.remove('active', 'completed');
            }
        }

        function resetUI() {
            elements.pingResult.innerHTML = '--<span class="result-unit">ms</span>';
            elements.downloadResult.innerHTML = '--<span class="result-unit">Mbps</span>';
            elements.uploadResult.innerHTML = '--<span class="result-unit">Mbps</span>';
            elements.downloadData.textContent = 'Data used: --';
            elements.uploadData.textContent = 'Data used: --';

            setTestStatus('ping', 'Waiting...', 0);
            setTestStatus('download', 'Waiting...', 0);
            setTestStatus('upload', 'Waiting...', 0);

            elements.summary.classList.remove('show');
            hideError();
        }

        // Ping Test - Measures Round Trip Time (RTT) latency
        // This test measures how long it takes for a request to reach the server and return.
        // We perform multiple measurements and average them for accuracy.
        async function testPing() {
            setTestStatus('ping', 'Testing...', 0);
            const pingTimes = [];

            // Perform multiple ping tests and average them
            for (let i = 0; i < CONFIG.PING_COUNT; i++) {
                try {
                    // Record time before sending request
                    const startTime = performance.now();

                    // Send minimal request to server
                    const response = await fetch(`${serverUrl}/ping`, {
                        method: 'GET',
                        cache: 'no-cache'  // Ensure fresh request, no caching
                    });

                    // Record time after receiving response
                    const endTime = performance.now();

                    if (!response.ok) {
                        throw new Error(`Ping failed with status ${response.status}`);
                    }

                    // Calculate Round Trip Time (RTT) in milliseconds
                    const rtt = endTime - startTime;
                    pingTimes.push(rtt);

                    // Update progress
                    const progress = ((i + 1) / CONFIG.PING_COUNT) * 100;
                    setTestStatus('ping', `Testing... (${i + 1}/${CONFIG.PING_COUNT})`, progress);

                    // Update display with current average
                    const currentAvg = pingTimes.reduce((a, b) => a + b, 0) / pingTimes.length;
                    elements.pingResult.innerHTML = `${currentAvg.toFixed(1)}<span class="result-unit">ms</span>`;

                    // Small delay between pings
                    if (i < CONFIG.PING_COUNT - 1) {
                        await new Promise(resolve => setTimeout(resolve, 200));
                    }
                } catch (error) {
                    throw new Error(`Ping test failed: ${error.message}`);
                }
            }

            // Calculate average
            const averagePing = pingTimes.reduce((a, b) => a + b, 0) / pingTimes.length;
            testResults.ping = averagePing;

            elements.pingResult.innerHTML = `${averagePing.toFixed(1)}<span class="result-unit">ms</span>`;
            setTestStatus('ping', 'Completed', 100);

            return averagePing;
        }

        // Download Test - Dynamic with stabilization detection
        // This test downloads data from the server using multiple parallel connections.
        // Instead of downloading a fixed amount, it streams continuously and stops
        // automatically when the speed stabilizes, minimizing data usage.
        // Speed = (total bits received) / (time elapsed)
        async function testDownload() {
            setTestStatus('download', 'Testing...', 0);

            const startTime = performance.now();
            let speedHistory = [];
            let lastMeasurementTime = startTime;

            // Shared state for all parallel connections
            const state = {
                totalBytes: 0,      // Track total bytes downloaded across all connections
                shouldStop: false   // Signal to stop all workers
            };

            // AbortController allows us to cancel in-flight HTTP requests immediately
            // when stabilization is detected, preventing unnecessary data transfer
            const abortController = new AbortController();
            let monitorInterval = null;

            try {
                // Download worker - continuously streams data from server
                // Each worker runs in parallel to saturate the available bandwidth
                const downloadWorker = async () => {
                    try {
                        // Request large continuous stream (will be aborted when speed stabilizes)
                        const response = await fetch(`${serverUrl}/download?size=${CONFIG.STREAM_SIZE}`, {
                            method: 'GET',
                            cache: 'no-cache',
                            signal: abortController.signal  // Allow aborting mid-stream
                        });

                        if (!response.ok) {
                            throw new Error(`Download failed with status ${response.status}`);
                        }

                        // Read response body as a stream
                        const reader = response.body.getReader();

                        // Continuously read chunks until stopped or stream ends
                        while (!state.shouldStop) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            // Accumulate bytes for speed calculation
                            state.totalBytes += value.length;
                        }
                    } catch (error) {
                        // Ignore abort errors (expected when we stop the test)
                        if (error.name === 'AbortError' || state.shouldStop) {
                            return;
                        }
                        throw error;
                    }
                };

                // Start parallel download workers
                const workers = [];
                for (let i = 0; i < CONFIG.PARALLEL_CONNECTIONS; i++) {
                    workers.push(downloadWorker());
                }

                // Monitor progress and check for stabilization
                monitorInterval = setInterval(() => {
                    const now = performance.now();
                    const elapsed = (now - startTime) / 1000;
                    const currentBytes = state.totalBytes;
                    const bits = currentBytes * 8;
                    const currentSpeed = bits / elapsed;

                    // Record speed measurement
                    if (now - lastMeasurementTime >= CONFIG.MEASUREMENT_INTERVAL) {
                        speedHistory.push(currentSpeed);
                        lastMeasurementTime = now;

                        // Update UI
                        const progress = Math.min((elapsed / CONFIG.MIN_TEST_DURATION) * 100, 99);
                        setTestStatus('download', 'Testing...', progress);
                        elements.downloadResult.innerHTML = `${formatSpeed(currentSpeed)}<span class="result-unit">Mbps</span>`;
                        elements.downloadData.textContent = `Data used: ${formatBytes(currentBytes)}`;

                        // Check if we should stop
                        const hasMinDuration = elapsed >= CONFIG.MIN_TEST_DURATION / 1000;
                        const hasMaxDuration = elapsed >= CONFIG.MAX_TEST_DURATION / 1000;
                        const isStable = isSpeedStable(speedHistory);

                        if ((hasMinDuration && isStable) || hasMaxDuration) {
                            state.shouldStop = true;
                            abortController.abort();
                            clearInterval(monitorInterval);
                        }
                    }
                }, 50); // Check every 50ms

                // Wait for workers to complete with timeout protection
                await Promise.race([
                    Promise.all(workers),
                    new Promise((resolve) => setTimeout(resolve, CONFIG.MAX_TEST_DURATION + 2000))
                ]);

                // Ensure cleanup
                if (monitorInterval) clearInterval(monitorInterval);
                state.shouldStop = true;
                abortController.abort();

                const endTime = performance.now();
                const duration = (endTime - startTime) / 1000;
                const totalBitsDownloaded = state.totalBytes * 8;
                const finalSpeed = totalBitsDownloaded / duration;

                testResults.download = finalSpeed / (1024 * 1024);
                testResults.downloadData = state.totalBytes;

                elements.downloadResult.innerHTML = `${formatSpeed(finalSpeed)}<span class="result-unit">Mbps</span>`;
                elements.downloadData.textContent = `Data used: ${formatBytes(state.totalBytes)}`;
                setTestStatus('download', 'Completed', 100);

                return finalSpeed;
            } catch (error) {
                throw new Error(`Download test failed: ${error.message}`);
            }
        }

        // Upload Test - Dynamic with stabilization detection and optimized data generation
        // This test uploads data to the server using multiple parallel connections.
        // Like the download test, it continues until speed stabilizes, minimizing data usage.
        // Speed = (total bits sent) / (time elapsed)
        async function testUpload() {
            setTestStatus('upload', 'Testing...', 0);

            // Pre-generate upload buffer once and reuse for all connections
            // We use a simple repeating pattern (not crypto random) for speed:
            // - Faster generation means test starts quicker
            // - Pattern doesn't affect upload speed measurement
            // - Reduces CPU usage during test
            const uploadBuffer = new Uint8Array(CONFIG.UPLOAD_BUFFER_SIZE);
            for (let i = 0; i < uploadBuffer.length; i++) {
                uploadBuffer[i] = i & 0xFF;  // Simple 0-255 repeating pattern
            }

            const startTime = performance.now();
            let speedHistory = [];
            let lastMeasurementTime = startTime;

            // Shared state for all connections
            const state = {
                totalBytes: 0,
                shouldStop: false,
                activeUploads: []
            };

            let monitorInterval = null;

            try {
                // Function to upload continuously
                const uploadWorker = async () => {
                    while (!state.shouldStop) {
                        try {
                            const xhr = new XMLHttpRequest();
                            state.activeUploads.push(xhr);

                            const uploadPromise = new Promise((resolve, reject) => {
                                let lastLoaded = 0;

                                xhr.upload.addEventListener('progress', (event) => {
                                    if (event.lengthComputable && !state.shouldStop) {
                                        const byteDiff = event.loaded - lastLoaded;
                                        lastLoaded = event.loaded;
                                        state.totalBytes += byteDiff;
                                    }
                                });

                                xhr.addEventListener('load', () => {
                                    state.activeUploads = state.activeUploads.filter(x => x !== xhr);
                                    if (xhr.status >= 200 && xhr.status < 300) {
                                        resolve();
                                    } else {
                                        reject(new Error(`Upload failed with status ${xhr.status}`));
                                    }
                                });

                                xhr.addEventListener('error', () => {
                                    state.activeUploads = state.activeUploads.filter(x => x !== xhr);
                                    reject(new Error('Upload request failed'));
                                });

                                xhr.addEventListener('abort', () => {
                                    state.activeUploads = state.activeUploads.filter(x => x !== xhr);
                                    resolve();
                                });

                                xhr.open('POST', `${serverUrl}/upload`);
                                xhr.setRequestHeader('Content-Type', 'application/octet-stream');
                                xhr.send(uploadBuffer);
                            });

                            await uploadPromise;
                            if (state.shouldStop) break;

                        } catch (error) {
                            if (state.shouldStop) break;
                            throw error;
                        }
                    }
                };

                // Start parallel upload workers
                const workers = [];
                for (let i = 0; i < CONFIG.PARALLEL_CONNECTIONS; i++) {
                    workers.push(uploadWorker());
                }

                // Monitor progress and check for stabilization
                monitorInterval = setInterval(() => {
                    const now = performance.now();
                    const elapsed = (now - startTime) / 1000;
                    const currentBytes = state.totalBytes;
                    const bits = currentBytes * 8;
                    const currentSpeed = bits / elapsed;

                    // Record speed measurement
                    if (now - lastMeasurementTime >= CONFIG.MEASUREMENT_INTERVAL) {
                        speedHistory.push(currentSpeed);
                        lastMeasurementTime = now;

                        // Update UI
                        const progress = Math.min((elapsed / CONFIG.MIN_TEST_DURATION) * 100, 99);
                        setTestStatus('upload', 'Testing...', progress);
                        elements.uploadResult.innerHTML = `${formatSpeed(currentSpeed)}<span class="result-unit">Mbps</span>`;
                        elements.uploadData.textContent = `Data used: ${formatBytes(currentBytes)}`;

                        // Check if we should stop
                        const hasMinDuration = elapsed >= CONFIG.MIN_TEST_DURATION / 1000;
                        const hasMaxDuration = elapsed >= CONFIG.MAX_TEST_DURATION / 1000;
                        const isStable = isSpeedStable(speedHistory);

                        if ((hasMinDuration && isStable) || hasMaxDuration) {
                            state.shouldStop = true;
                            state.activeUploads.forEach(xhr => xhr.abort());
                            clearInterval(monitorInterval);
                        }
                    }
                }, 50); // Check every 50ms

                // Wait for workers to complete with timeout protection
                await Promise.race([
                    Promise.all(workers),
                    new Promise((resolve) => setTimeout(resolve, CONFIG.MAX_TEST_DURATION + 2000))
                ]);

                // Ensure cleanup
                if (monitorInterval) clearInterval(monitorInterval);
                state.shouldStop = true;
                state.activeUploads.forEach(xhr => xhr.abort());

                const endTime = performance.now();
                const duration = (endTime - startTime) / 1000;
                const totalBitsUploaded = state.totalBytes * 8;
                const finalSpeed = totalBitsUploaded / duration;

                testResults.upload = finalSpeed / (1024 * 1024);
                testResults.uploadData = state.totalBytes;

                elements.uploadResult.innerHTML = `${formatSpeed(finalSpeed)}<span class="result-unit">Mbps</span>`;
                elements.uploadData.textContent = `Data used: ${formatBytes(state.totalBytes)}`;
                setTestStatus('upload', 'Completed', 100);

                return finalSpeed;
            } catch (error) {
                throw new Error(`Upload test failed: ${error.message}`);
            }
        }

        // Show Summary
        function showSummary() {
            document.getElementById('summaryPing').textContent = `${testResults.ping.toFixed(1)} ms`;
            document.getElementById('summaryDownload').textContent = `${testResults.download.toFixed(2)} Mbps`;
            document.getElementById('summaryUpload').textContent = `${testResults.upload.toFixed(2)} Mbps`;
            document.getElementById('summaryDownloadData').textContent = formatBytes(testResults.downloadData);
            document.getElementById('summaryUploadData').textContent = formatBytes(testResults.uploadData);

            elements.summary.classList.add('show');
        }

        // Main Test Function
        async function runSpeedTest() {
            // Auto-detect server URL from current page location
            serverUrl = window.location.origin;

            // Disable button
            elements.startButton.disabled = true;
            elements.startButton.textContent = 'Testing...';

            // Reset UI
            resetUI();

            try {
                // Test server connectivity
                const healthResponse = await fetch(`${serverUrl}/health`);
                if (!healthResponse.ok) {
                    throw new Error('Cannot connect to server');
                }

                // Run tests sequentially without delays
                await testPing();
                await testDownload();
                await testUpload();

                // Show summary
                showSummary();

            } catch (error) {
                showError(error.message);
                console.error('Test error:', error);
            } finally {
                // Re-enable button
                elements.startButton.disabled = false;
                elements.startButton.textContent = 'Start Test';
            }
        }

        // Event Listeners
        elements.startButton.addEventListener('click', runSpeedTest);
    </script>
</body>
</html>
